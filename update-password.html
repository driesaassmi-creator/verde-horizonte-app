<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070d" />
  <title>Nieuw wachtwoord · Verde Horizonte</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="brand-hero">
    <div class="brand-logo">🌅</div>
    <h1>Verde Horizonte</h1>
    <p class="tagline">Nieuw wachtwoord instellen</p>
  </header>

  <main class="container" style="max-width:420px">
    <section class="card">
      <h3><span class="bar"></span> Nieuw wachtwoord</h3>
      <p class="sub" style="margin-bottom:14px">Kies een nieuw wachtwoord voor je account.</p>
      <form id="updateForm" autocomplete="off">
        <div class="field">
          <label for="password">Nieuw wachtwoord</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <div class="field">
          <label for="confirm">Bevestig wachtwoord</label>
          <input id="confirm" type="password" placeholder="••••••••" autocomplete="new-password" required />
        </div>
        <button type="submit" class="btn btn-gold" id="btnUpdate" style="width:100%">Wachtwoord opslaan</button>
        <p class="sub" id="updateMsg" style="margin-top:14px"></p>
      </form>
    </section>

    <p style="text-align:center; margin-top:16px">
      <a href="login.html" style="color:var(--accent)">← Terug naar inloggen</a>
    </p>

    <footer class="foot-note">
      Alle gegevens worden veilig opgeslagen in Supabase.
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('updateForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      const btn = document.getElementById('btnUpdate');
      const msg = document.getElementById('updateMsg');

      msg.textContent = '';

      if (password.length < 6) {
        msg.textContent = 'Het wachtwoord moet minimaal 6 tekens bevatten.';
        return;
      }
      if (password !== confirm) {
        msg.textContent = 'De wachtwoorden komen niet overeen.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Bezig met opslaan...';

      const { error } = await VH.updatePassword(password);

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Wachtwoord opslaan';
        msg.textContent = 'Opslaan mislukt: ' + error.message;
        return;
      }

      location.replace('login.html');
    });
  </script>
</body>
</html>
