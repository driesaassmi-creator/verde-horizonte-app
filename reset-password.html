<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070d" />
  <title>Wachtwoord vergeten · Verde Horizonte</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="brand-hero">
    <div class="brand-logo">🌅</div>
    <h1>Verde Horizonte</h1>
    <p class="tagline">Wachtwoord opnieuw instellen</p>
  </header>

  <main class="container" style="max-width:420px">
    <section class="card">
      <h3><span class="bar"></span> Wachtwoord vergeten</h3>
      <p class="sub" style="margin-bottom:14px">Vul je e-mailadres in. We sturen je een link waarmee je een nieuw wachtwoord kunt instellen.</p>
      <form id="resetForm" autocomplete="on">
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" type="email" placeholder="naam@bedrijf.nl" autocomplete="email" required />
        </div>
        <button type="submit" class="btn btn-gold" id="btnReset" style="width:100%">Stuur reset-link</button>
        <p class="sub" id="resetMsg" style="margin-top:14px"></p>
      </form>
    </section>

    <p style="text-align:center; margin-top:16px">
      <a href="login.html" style="color:var(--accent)">← Terug naar inloggen</a>
    </p>

    <footer class="foot-note">
      Alle gegevens worden veilig opgeslagen in Supabase.
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script>
    document.getElementById('resetForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('btnReset');
      const msg = document.getElementById('resetMsg');

      btn.disabled = true;
      btn.textContent = 'Bezig met verzenden...';
      msg.textContent = '';

      const { error } = await VH.resetPassword(email);

      if (error) {
        btn.disabled = false;
        btn.textContent = 'Stuur reset-link';
        msg.textContent = 'Verzenden mislukt: ' + error.message;
        return;
      }

      btn.textContent = 'Stuur reset-link';
      msg.textContent = 'Controleer je e-mail voor de reset-link.';
    });
  </script>
</body>
</html>
